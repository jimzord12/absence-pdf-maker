<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0f172a"/>
  <g fill="#ffffff">
    <!-- Calendar base -->
    <rect x="96" y="128" width="320" height="288" rx="16" fill="#ffffff" fill-opacity="0.1"/>
    <!-- Calendar header -->
    <rect x="96" y="128" width="320" height="80" rx="16" fill="#ffffff" fill-opacity="0.2"/>
    <!-- Calendar rings -->
    <rect x="128" y="80" width="32" height="64" rx="8"/>
    <rect x="352" y="80" width="32" height="64" rx="8"/>
    <!-- Document icon inside -->
    <rect x="160" y="240" width="192" height="144" rx="8" fill="#ffffff" fill-opacity="0.15"/>
    <!-- Lines representing text -->
    <rect x="192" y="272" width="128" height="16" rx="4"/>
    <rect x="192" y="304" width="128" height="16" rx="4"/>
    <rect x="192" y="336" width="96" height="16" rx="4"/>
  </g>
</svg>
